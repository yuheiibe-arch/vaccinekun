<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <?!= include('style.css.html'); ?>
</head>
<body>
  <div class="container">
    <div id="screen-1" class="screen active">
      <div class="header">
        <h1>ワクチンくん起動</h1>
        <p>実行する操作を選択してください。</p>
      </div>
      <div class="card-grid">
        <div class="card" onclick="selectAlertType('unfulfilled');">
          <span class="icon material-symbols-outlined">crisis_alert</span>
          <h2>未充足危険アラート</h2>
        </div>
        <div class="card" onclick="selectAlertType('transfer');">
          <span class="icon material-symbols-outlined">swap_horiz</span>
          <h2>振替依頼アラート</h2>
        </div>
        <div class="card" onclick="runDailyAlert();">
          <span class="icon material-symbols-outlined">today</span>
          <h2>Dailyアラート手動実行</h2>
        </div>
      </div>
    </div>
    <div id="screen-2" class="screen">
      <div class="header">
        <h1>拠点を選択</h1>
        <p>アラートを作成する未充足の拠点を選択してください。（複数選択可）</p>
      </div>
      <div id="location-list-container" class="location-list"></div>
      <div class="button-container">
        <button class="button button-secondary" onclick="goBack('screen-1')">戻る</button>
        <button class="button button-primary" onclick="selectLocation()">進む</button>
      </div>
    </div>
    <div id="screen-3" class="screen">
       <div class="header">
        <h1>メッセージを編集</h1>
        <p>宛先や内容を編集し、オプションを選択してください。</p>
      </div>
      <div class="editor-grid">
        <div class="editor-main">
          <textarea id="message-template"></textarea>
        </div>
        <div class="editor-side">
          <div id="mention-options-container" class="option-group">
            <h3>宛先</h3>
          </div>
          <div id="reason-options-container" class="option-group">
            <h3>原因</h3>
          </div>
          <div id="approach-options-container" class="option-group">
            <h3>アプローチ状況</h3>
          </div>
          <div id="risk-options-container" class="option-group">
            <h3>危険度</h3>
          </div>
        </div>
      </div>
       <div class="button-container">
        <button class="button button-secondary" onclick="goBack('screen-2')">戻る</button>
        <button class="button button-primary" onclick="confirmContent()">内容を確定</button>
      </div>
    </div>
    <div id="screen-4" class="screen">
       <div class="header">
        <h1>投稿内容の確認</h1>
        <p>以下の内容で投稿します。よろしいですか？</p>
      </div>
      <div id="final-preview" class="final-preview"></div>
      <div class="button-container">
        <button class="button button-secondary" onclick="goBack('screen-3')">戻る</button>
        <button id="post-button" class="button button-primary" onclick="initiatePosting()">投稿する</button>
      </div>
    </div>
  </div>
  <?!= include('logic.js.html'); ?>
</body>
</html>
